id: std-ftms-rower
name: Fitness machine (rower)
reader: notify
version: 1
status: draft
provenance: >
  The Bluetooth Fitness Machine Service (FTMS) and its Rower Data characteristic (0x2AD1), as the
  Bluetooth SIG publishes them in the GATT Specification Supplement. Reading only. A standard
  table: maintained by the maintainers.
verified_on:
  - not verified on a device yet

match:
  - service: "1826"

notify:
  service: "1826"
  characteristic: "2ad1"
  min_length: 2

# 0-1   flags. Stroke rate and stroke count are present when bit 0 ("more data") is clear; the
#       rest when its bit is set: average stroke rate (bit 2), distance (bit 3, m), pace (bit 4,
#       s/500 m), average pace (bit 5), power (bit 6, W).
# TO CHECK ON A ROWER: the stroke rate's resolution (whole strokes, or halves), and whether the
#       stroke count follows bit 0 or bit 1. Parts after the average power (resistance, energy,
#       heart rate, time) are not read until a recording settles their sizes.
stale_after_ms: 5000

layout:
  start: 2
  parts:
    - { name: stroke_rate, type: u8, when: "!(u16le[0] & 1)" }
    - { name: stroke_count, type: u16le, when: "!(u16le[0] & 1)" }
    - { name: avg_stroke_rate, type: skip1, when: "u16le[0] & 4" }
    - { name: distance, type: u24le, when: "u16le[0] & 8" }
    - { name: pace, type: skip2, when: "u16le[0] & 16" }
    - { name: avg_pace, type: skip2, when: "u16le[0] & 32" }
    - { name: power, type: i16le, when: "u16le[0] & 64" }

fields:
  stroke_rate: stroke_rate
  stroke_count: stroke_count
  distance: distance
  power: power
