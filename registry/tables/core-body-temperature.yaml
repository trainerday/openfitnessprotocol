id: core-body-temperature
name: CORE body temperature
reader: broadcast
version: 1
# Draft: written from the maker's documentation, not yet tried on a sensor. Its owner checks it in
# the Studio (ofp studio → Live) and adds their recording; then it becomes experimental.
status: draft

provenance: >
  greenTEG's published "CORE Connectivity Implementation Notes" (the sensor's advertisement, which
  carries the current core temperature). No code from other projects.
verified_on:
  - not verified on a sensor yet

# The sensor can be read without connecting: its advertisement carries the core temperature.
# Payload after the 2-byte company id:
#   0     version of this data (0)
#   1     status: low four bits = state of the sensor (4 = measuring)
#   2-3   core temperature, thousandths of a degree Celsius
match:
  - manufacturer_id: 0xF60B
    min_length: 4

stale_after_ms: 15000

fields:
  core_temperature: u16le[2] / 1000
