name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # Everything except the Bluetooth commands, which need a radio.
      - name: Tests
        run: cargo test -p ofp-core -p ofp-ffi -p ofp-capture -p ofp-registry -p ofp-studio && cargo test -p ofp-cli --no-default-features
      - name: The core builds for a microcontroller (no_std)
        run: cargo build -p ofp-core --target thumbv7em-none-eabihf
      - name: Registry check (fields, tables, vectors, captures)
        run: cargo run -p ofp-cli --no-default-features -- check
      # The distribution's binaryen is too old for the WebAssembly features Rust emits today
      - name: binaryen (the core as plain JavaScript, for runtimes with no WebAssembly)
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: WebAssembly core, plain-JavaScript core and bundle
        run: scripts/build.sh
      - name: JavaScript package, against both forms of the core
        run: cd packages/ofp-js && node --test test/ofp.test.js
