[package]
name = "ofp-registry"
description = "Reads the OFP registry (fields and tables as YAML), compiles it, and checks tables against captures."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ofp-core = { path = "../ofp-core" }
ofp-capture = { path = "../ofp-capture" }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
serde_yaml_ng = "0.10.0"
