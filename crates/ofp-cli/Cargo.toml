[package]
name = "ofp-cli"
description = "The ofp command: check the registry, decode packets, record and watch devices."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ofp"
path = "src/main.rs"

[features]
default = ["ble"]
# Bluetooth commands (scan, record, live). CI builds without it.
ble = ["ofp-capture/ble", "dep:tokio", "dep:crossterm", "dep:futures"]

[dependencies]
ofp-core = { path = "../ofp-core" }
ofp-capture = { path = "../ofp-capture" }
ofp-registry = { path = "../ofp-registry" }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
clap = { version = "4.6.9", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal"], optional = true }
crossterm = { version = "0.29.0", optional = true }
futures = { version = "0.3.34", optional = true }
