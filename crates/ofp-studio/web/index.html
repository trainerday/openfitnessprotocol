<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OFP Studio</title>
<link rel="stylesheet" href="/studio.css">
</head>
<body>
<header>
  <div class="brand">OFP Studio</div>
  <nav id="tabs">
    <button data-tab="devices"><b>1</b> Devices</button>
    <button data-tab="record"><b>2</b> Record</button>
    <button data-tab="map"><b>3</b> Map</button>
    <button data-tab="live"><b>4</b> Live</button>
    <button data-tab="save"><b>5</b> Save</button>
    <button data-tab="tester"><b>✓</b> Tester</button>
    <button data-tab="recordings"><b>↺</b> Recordings</button>
  </nav>
  <div class="grow"></div>
  <div id="chip" class="chip"></div>
  <button id="assistant-open" class="ghost">Work with an assistant</button>
</header>
<div id="banner" class="banner" hidden></div>
<main id="main"></main>
<div id="toast" class="toast" hidden></div>
<dialog id="dialog"></dialog>
<script src="/tester.js"></script>
<script src="/studio.js"></script>
</body>
</html>
